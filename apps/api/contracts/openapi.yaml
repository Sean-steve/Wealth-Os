openapi: 3.1.0
info:
  title: Wealth OS B0 REST Contracts
  version: 0.3.0-b2
  description: >
    Tenant-isolated Wealth-owned strategic records, signed source snapshot ingestion and subject-scoped financial projections. No live providers or identity are deployed by this repository; real source activation requires externally verified publishers and consent.
servers:
  - url: http://127.0.0.1:3009
security:
  - OidcAccessToken: [wealth:read]
tags:
  - name: Platform
  - name: Profile
  - name: Goals
components:
  securitySchemes:
    SourceServiceJwt:
      type: oauth2
      description: >
        Pinned service-only OIDC access token with dedicated wealth-os-source-ingest
        audience and wealth:ingest scope. This is not a browser client credential.
      flows:
        clientCredentials:
          tokenUrl: https://issuer.example.test/token
          scopes:
            wealth:ingest: Submit reconciled source snapshots
    OidcAccessToken:
      type: oauth2
      description: >
        Personal Kernel-approved OIDC access token verified using issuer, audience,
        signature, expiration, issued-at and supported asymmetric JWT algorithms.
      flows:
        authorizationCode:
          authorizationUrl: https://issuer.example.test/authorize
          tokenUrl: https://issuer.example.test/token
          scopes:
            wealth:read: Read tenant-scoped wealth resources
            wealth:write: Modify Wealth-owned strategic records
  parameters:
    Tenant:
      name: X-Wealth-Tenant-Id
      in: header
      required: true
      description: Requested tenant UUID. Never authoritative until DB membership is verified.
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted integer version, e.g. '"1"'. Use '"0"' when creating a profile.
      schema: {type: string, pattern: '^"(0|[1-9][0-9]*)"$'}
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique, 8–128 characters; actor and request payload are bound to the key.
      schema: {type: string, minLength: 8, maxLength: 128}
    GoalId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, correlation_id]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object}
            correlation_id: {type: string, format: uuid}
    Profile:
      type: object
      required: [tenantId,baseCurrency,wealthStage,strategyNote,version,updatedAt]
      properties:
        tenantId: {type: string, format: uuid}
        baseCurrency: {const: KES}
        wealthStage: {type: string, enum: [BUILDING,GROWING,PROTECTING,INDEPENDENT,LEGACY]}
        strategyNote: {type: string, maxLength: 2000}
        version: {type: string, description: "Positive integer as string."}
        updatedAt: {type: string, format: date-time}
    ProfileInput:
      type: object
      additionalProperties: false
      required: [baseCurrency,wealthStage]
      properties:
        baseCurrency: {const: KES}
        wealthStage: {type: string, enum: [BUILDING,GROWING,PROTECTING,INDEPENDENT,LEGACY]}
        strategyNote: {type: string, maxLength: 2000}
    Goal:
      type: object
      required: [id,tenantId,title,metric,targetAmount,targetDate,priority,status,version,createdAt,updatedAt]
      properties:
        id: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        title: {type: string}
        metric: {type: string, enum: [NET_WORTH,LIQUID_WEALTH,PASSIVE_INCOME,DEPLOYABLE_CAPITAL,INVESTED_CAPITAL,CUSTOM]}
        targetAmount: {type: string, pattern: '^[0-9]+(\\.[0-9]{1,4})?$'}
        targetDate: {type: string, format: date}
        priority: {type: string, enum: [LOW,MEDIUM,HIGH]}
        status: {type: string, enum: [ACTIVE,PAUSED,COMPLETED,ARCHIVED]}
        version: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    GoalCreate:
      type: object
      additionalProperties: false
      required: [title,metric,targetAmount,targetDate]
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        metric: {type: string, enum: [NET_WORTH,LIQUID_WEALTH,PASSIVE_INCOME,DEPLOYABLE_CAPITAL,INVESTED_CAPITAL,CUSTOM]}
        targetAmount: {type: string, pattern: '^[0-9]+(\\.[0-9]{1,4})?$'}
        targetDate: {type: string, format: date}
        priority: {type: string, enum: [LOW,MEDIUM,HIGH]}
    GoalPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        metric: {type: string, enum: [NET_WORTH,LIQUID_WEALTH,PASSIVE_INCOME,DEPLOYABLE_CAPITAL,INVESTED_CAPITAL,CUSTOM]}
        targetAmount: {type: string}
        targetDate: {type: string, format: date}
        priority: {type: string, enum: [LOW,MEDIUM,HIGH]}
        status: {type: string, enum: [ACTIVE,PAUSED,COMPLETED,ARCHIVED]}
    B1StrategyInput:
      type: object
      additionalProperties: false
      required: [goalId,name,allocationTargets,assumptions]
      properties:
        goalId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        thesis: {type: string, maxLength: 3000}
        allocationTargets:
          type: array
          minItems: 1
          maxItems: 20
          description: Integer basis points must sum to 10000.
          items:
            type: object
            required: [label,basisPoints]
            additionalProperties: false
            properties:
              label: {type: string, minLength: 1, maxLength: 120}
              basisPoints: {type: integer, minimum: 0, maximum: 10000}
        assumptions:
          type: object
          required: [riskTolerance,horizonYears,assumedAnnualReturnPct]
          additionalProperties: false
          properties:
            riskTolerance: {enum: [CONSERVATIVE,BALANCED,GROWTH]}
            horizonYears: {type: integer, minimum: 1, maximum: 60}
            assumedAnnualReturnPct: {type: number, minimum: -50, maximum: 50}
    B1StrategyRevision:
      type: object
      additionalProperties: false
      required: [name,allocationTargets,assumptions]
      description: Goal ID is immutable and MUST NOT be submitted in a strategy revision.
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        thesis: {type: string, maxLength: 3000}
        allocationTargets:
          type: array
          minItems: 1
          maxItems: 20
          description: Must sum to exactly 10000 integer basis points.
          items:
            type: object
            required: [label,basisPoints]
            additionalProperties: false
            properties:
              label: {type: string, minLength: 1, maxLength: 120}
              basisPoints: {type: integer, minimum: 0, maximum: 10000}
        assumptions:
          type: object
          required: [riskTolerance,horizonYears,assumedAnnualReturnPct]
          additionalProperties: false
          properties:
            riskTolerance: {enum: [CONSERVATIVE,BALANCED,GROWTH]}
            horizonYears: {type: integer, minimum: 1, maximum: 60}
            assumedAnnualReturnPct: {type: number, minimum: -50, maximum: 50}
    B2SourceSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion,eventId,sourceSystem,sourceRevision,asOf,personRef,complete,
        completenessEvidence]
      properties:
        schemaVersion: {const: 1}
        eventId: {type: string, format: uuid}
        sourceSystem: {enum: ['Finance OS','Asset OS','Company OS']}
        sourceRevision: {type: string, minLength: 1, maxLength: 150}
        asOf: {type: string, format: date-time}
        personRef: {type: string, minLength: 3, maxLength: 180}
        complete: {const: true}
        completenessEvidence:
          type: object
          required: [coverage,sourceRecordCount,attestation]
          additionalProperties: false
          properties:
            coverage: {const: ALL}
            sourceRecordCount: {type: integer, minimum: 0}
            attestation: {type: string, minLength: 15, maxLength: 500}
        holdings:
          type: array
          maxItems: 250
          items:
            type: object
            additionalProperties: false
            required: [sourceEntityType,sourceEntityId,canonicalAssetRef,category,ownerFraction,
              valuationAmount,valuationCurrency,valuationAsOf,valuationMethod,sourceVersion,
              qualityStatus,provenance]
            properties:
              sourceEntityType: {type: string}
              sourceEntityId: {type: string}
              canonicalAssetRef: {type: string}
              category: {enum: [BUSINESS_EQUITY,PROPERTY,INVESTMENTS,CASH,OTHER]}
              ownerFraction: {type: string, description: Decimal between 0 exclusive and 1 inclusive, six places maximum}
              valuationAmount: {type: string, description: KES decimal, four places maximum}
              valuationCurrency: {const: KES}
              valuationAsOf: {type: string, format: date-time}
              valuationMethod: {type: string}
              sourceVersion: {type: string}
              qualityStatus: {enum: [VERIFIED,ESTIMATED,STALE,UNVERIFIED]}
              provenance: {type: object, description: Evidence only; limited to twelve primitive fields}
        incomes:
          type: array
          maxItems: 250
          items:
            type: object
            required: [sourceEntityId,monthlyAmount,currency,passive,sourceAsOf,provenance]
            additionalProperties: false
            properties:
              sourceEntityId: {type: string}
              monthlyAmount: {type: string}
              currency: {const: KES}
              passive: {type: boolean}
              sourceAsOf: {type: string, format: date-time}
              provenance: {type: object}
        liabilities:
          type: array
          maxItems: 250
          items:
            type: object
            required: [sourceEntityId,outstandingAmount,currency,sourceAsOf,provenance]
            additionalProperties: false
            properties:
              sourceEntityId: {type: string}
              outstandingAmount: {type: string}
              currency: {const: KES}
              sourceAsOf: {type: string, format: date-time}
              provenance: {type: object}
        capitalPools:
          type: array
          maxItems: 100
          items:
            type: object
            required: [sourceEntityRef,name,purpose,classifiedCash,reservedCash,committedCash,sourceAsOf]
            additionalProperties: false
            properties:
              sourceEntityRef: {type: string}
              name: {type: string}
              purpose: {type: string}
              classifiedCash: {type: string}
              reservedCash: {type: string}
              committedCash: {type: string}
              sourceAsOf: {type: string, format: date-time}
paths:
  /health:
    get:
      tags: [Platform]
      summary: Liveness; no identity required; never exposes financial data
      security: []
      responses:
        '200': {description: Process alive}
  /ready:
    get:
      tags: [Platform]
      summary: PostgreSQL connectivity, no secrets or tenant data
      security: []
      responses:
        '200': {description: Database reachable}
        '503': {description: Database unavailable}
  /api/v1/wealth/capabilities:
    get:
      tags: [Platform]
      summary: Authenticated feature readiness (B0)
      parameters: [{$ref: '#/components/parameters/Tenant'}]
      responses:
        '200': {description: Explicitly flags incomplete integrations}
        '401': {description: Missing or invalid access token}
        '403': {description: Not authorized to the tenant}
  /api/v1/wealth/profile:
    get:
      tags: [Profile]
      parameters: [{$ref: '#/components/parameters/Tenant'}]
      responses:
        '200':
          description: Versioned durable Wealth OS profile
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/Profile'}}
        '404': {description: Profile not created}
    put:
      tags: [Profile]
      security: [{OidcAccessToken: [wealth:write]}]
      parameters:
        - {$ref: '#/components/parameters/Tenant'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileInput'}
      responses:
        '200': {description: Updated version, ETag in response}
        '201': {description: Created with If-Match 0}
        '409': {description: Version conflict or idempotency collision}
        '428': {description: Missing precondition or idempotency key}
  /api/v1/wealth/goals:
    get:
      tags: [Goals]
      parameters:
        - {$ref: '#/components/parameters/Tenant'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: Keyset-paginated list with nextCursor}
    post:
      tags: [Goals]
      security: [{OidcAccessToken: [wealth:write]}]
      parameters:
        - {$ref: '#/components/parameters/Tenant'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalCreate'}
      responses:
        '201': {description: Goal created, Location and ETag headers}
        '400': {description: Invalid input}
        '409': {description: Idempotency conflict}
        '428': {description: Missing key}
  /api/v1/wealth/goals/{id}:
    get:
      tags: [Goals]
      parameters:
        - {$ref: '#/components/parameters/Tenant'}
        - {$ref: '#/components/parameters/GoalId'}
      responses:
        '200':
          description: Tenant-scoped goal with ETag
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: '#/components/schemas/Goal'}}}
        '404': {description: Missing or inaccessible goal}
    patch:
      tags: [Goals]
      security: [{OidcAccessToken: [wealth:write]}]
      parameters:
        - {$ref: '#/components/parameters/Tenant'}
        - {$ref: '#/components/parameters/GoalId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalPatch'}
      responses:
        '200': {description: Updated goal}
        '404': {description: Goal missing}
        '409': {description: Version/idempotency conflict}
        '428': {description: Missing precondition or idempotency key}
  /api/v1/wealth/goals/{id}/milestones:
    get:
      tags: [Goals]
      summary: List durable goal milestones
      parameters: [{$ref: '#/components/parameters/Tenant'},{$ref: '#/components/parameters/GoalId'}]
      responses:
        '200': {description: Tenant-scoped goal milestone collection}
        '404': {description: Parent goal not found}
    post:
      tags: [Goals]
      summary: Create a milestone, without moving capital
      security: [{OidcAccessToken: [wealth:write]}]
      parameters: [{$ref: '#/components/parameters/Tenant'},{$ref: '#/components/parameters/GoalId'},{$ref: '#/components/parameters/Idempotency'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title,targetAmount,dueDate]
              properties:
                title: {type: string, minLength: 1, maxLength: 160}
                targetAmount: {type: string, pattern: '^[0-9]+(\\.[0-9]{1,4})?$'}
                dueDate: {type: string, format: date}
      responses:
        '201': {description: New milestone and ETag}
        '422': {description: Milestone exceeds goal target or deadline}
        '428': {description: Missing Idempotency-Key}
  /api/v1/wealth/goals/{id}/milestones/{milestoneId}:
    patch:
      tags: [Goals]
      summary: Versioned milestone update
      security: [{OidcAccessToken: [wealth:write]}]
      parameters:
        - {$ref: '#/components/parameters/Tenant'}
        - {$ref: '#/components/parameters/GoalId'}
        - {$ref: '#/components/parameters/Idempotency'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: {type: string, minLength: 1, maxLength: 160}
                targetAmount: {type: string}
                dueDate: {type: string, format: date}
                status: {type: string, enum: [PLANNED,REACHED,MISSED,CANCELLED]}
      responses:
        '200': {description: Updated milestone and ETag}
        '409': {description: Optimistic concurrency conflict}
  /api/v1/wealth/strategies:
    get:
      tags: [Goals]
      summary: Latest version of each tenant-owned strategy
      parameters: [{$ref: '#/components/parameters/Tenant'}]
      responses:
        '200': {description: Strategy list with active and latest version pointers}
    post:
      tags: [Goals]
      summary: Create immutable DRAFT strategy version 1
      security: [{OidcAccessToken: [wealth:write]}]
      parameters: [{$ref: '#/components/parameters/Tenant'},{$ref: '#/components/parameters/Idempotency'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/B1StrategyInput'}
      responses:
        '201': {description: Durable planning draft, no execution}
        '422': {description: Linked goal not active}
  /api/v1/wealth/strategies/{id}:
    get:
      tags: [Goals]
      summary: Latest strategy plus immutable full version history
      parameters: [{$ref: '#/components/parameters/Tenant'},{$ref: '#/components/parameters/GoalId'}]
      responses:
        '200': {description: Latest strategy and version history}
        '404': {description: Strategy does not exist in tenant}
  /api/v1/wealth/strategies/{id}/versions:
    post:
      tags: [Goals]
      summary: Append draft revision; preserve history
      security: [{OidcAccessToken: [wealth:write]}]
      parameters: [{$ref: '#/components/parameters/Tenant'},{$ref: '#/components/parameters/GoalId'},{$ref: '#/components/parameters/IfMatch'},{$ref: '#/components/parameters/Idempotency'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/B1StrategyRevision'}
      responses:
        '201': {description: Newly appended draft version}
        '409': {description: Strategy version changed}
  /api/v1/wealth/strategies/{id}/activate:
    post:
      tags: [Goals]
      summary: Append an active planning-only version
      security: [{OidcAccessToken: [wealth:write]}]
      parameters: [{$ref: '#/components/parameters/Tenant'},{$ref: '#/components/parameters/GoalId'},{$ref: '#/components/parameters/IfMatch'},{$ref: '#/components/parameters/Idempotency'}]
      responses:
        '200': {description: Planning version activated; no trade or cash movement}
        '409': {description: Another strategy active for this goal or stale version}
  /api/v1/wealth/capital/pools:
    get:
      tags: [Goals]
      summary: Source-classified Finance OS cash; no money authority
      parameters: [{$ref: '#/components/parameters/Tenant'}]
      responses:
        '200': {description: Available classifications and source freshness}
  /api/v1/wealth/capital/proposals:
    get:
      tags: [Goals]
      summary: List tenant-scoped non-executing allocation proposals
      parameters: [{$ref: '#/components/parameters/Tenant'}]
      responses:
        '200': {description: Planning-only proposals}
    post:
      tags: [Goals]
      summary: Guarded allocation DRAFT without any transfer/hold
      security: [{OidcAccessToken: [wealth:write]}]
      parameters: [{$ref: '#/components/parameters/Tenant'},{$ref: '#/components/parameters/Idempotency'},{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [poolId,target,amount,rationale]
              additionalProperties: false
              properties:
                poolId: {type: string, format: uuid}
                target: {type: string, minLength: 3, maxLength: 200}
                amount: {type: string, pattern: '^[0-9]+(\\.[0-9]{1,4})?$'}
                rationale: {type: string, minLength: 20, maxLength: 1200}
      responses:
        '201': {description: DRAFT only, financialExecution false}
        '422': {description: Insufficient free cash, stale source, missing policy or cap exceeded}
  /api/v1/wealth/capital/proposals/{id}/cancel:
    post:
      tags: [Goals]
      summary: Cancel draft planning intent (not a financial reversal)
      security: [{OidcAccessToken: [wealth:write]}]
      parameters: [{$ref: '#/components/parameters/Tenant'},{$ref: '#/components/parameters/GoalId'},{$ref: '#/components/parameters/IfMatch'},{$ref: '#/components/parameters/Idempotency'}]
      responses:
        '200': {description: Cancelled planning intent}
        '409': {description: Proposal version changed or not a draft}
  /api/v1/wealth/portfolio/holdings:
    get:
      tags: [Profile]
      summary: Read-only holdings projection with active per-subject source consent
      parameters: [{$ref: '#/components/parameters/Tenant'}]
      responses:
        '200': {description: Consent-scoped holdings and missing consents}
  /api/v1/wealth/income:
    get:
      tags: [Profile]
      summary: Read-only income projection; income source remains authoritative
      parameters: [{$ref: '#/components/parameters/Tenant'}]
      responses:
        '200': {description: Consent-scoped income projections}
  /api/v1/wealth/liabilities:
    get:
      tags: [Profile]
      summary: Read-only Finance OS debt projections; no repayment authority
      parameters: [{$ref: '#/components/parameters/Tenant'}]
      responses:
        '200': {description: Consent-scoped debt projections}
  /api/v1/wealth/state:
    get:
      tags: [Profile]
      summary: Reconcile complete fresh source projections without inventing net worth
      description: >
        Returns status INCOMPLETE with null netWorth, grossAssets and liabilities
        unless subject has explicit consent for every required Finance/Asset/Company source,
        all three sources report complete fresh snapshots and all holdings/liabilities
        have verified recent KES valuation data.
      parameters: [{$ref: '#/components/parameters/Tenant'}]
      responses:
        '200':
          description: Completeness status with either null metrics or decimal-string ownership-weighted values
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [status,netWorth,grossAssets,liabilities,blockers,financialExecutionEnabled]
                    properties:
                      status: {enum: [INCOMPLETE, RECONCILED_SOURCE_PROJECTION]}
                      netWorth: {type: [string, 'null']}
                      grossAssets: {type: [string, 'null']}
                      liabilities: {type: [string, 'null']}
                      blockers: {type: array, items: {type: string}}
                      financialExecutionEnabled: {const: false}

  /api/v1/wealth/sources/status:
    get:
      summary: Effective per-subject source consent, approved producer binding and snapshot freshness
      tags: [Platform]
      parameters: [{$ref: '#/components/parameters/Tenant'}]
      responses:
        '200':
          description: Subject-scoped source status; never exposes unconsented source data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [sourceSystem,consented,authorizedProducerBound,status]
                      properties:
                        sourceSystem: {enum: ['Finance OS','Asset OS','Company OS']}
                        consented: {type: boolean}
                        authorizedProducerBound: {type: boolean}
                        status: {enum: [CONSENT_REQUIRED,PRODUCER_NOT_BOUND,AWAITING_SNAPSHOT,STALE,CURRENT]}
                        sourceAsOf: {type: [string,'null']}
                        sourceRevision: {type: [string,'null']}
        '403': {description: Token subject lacks verified issuer-bound Kernel identity and tenant membership}
  /api/v1/integrations/sources/{source}/snapshots:
    post:
      summary: Source-authoritative complete snapshot with producer signature and revocable consent
      tags: [Platform]
      description: >
        SERVER-TO-SERVER ONLY. Requires a short-lived signed OIDC SERVICE JWT with
        wealth:ingest scope and a separately configured integration issuer/audience/JWKS.
        The producer subject, issuer, source and person reference must match the
        administrator-provisioned source_grants record. Missing person consent,
        inactive Kernel binding, stale source, cross-source duplicate canonical assets,
        changed replays and out-of-order revisions fail closed.
        Wealth OS never executes financial transfers or changes an external source.
      security:
        - SourceServiceJwt: [wealth:ingest]
      parameters:
        - name: source
          in: path
          required: true
          schema: {enum: [finance,asset,company]}
        - {$ref: '#/components/parameters/Tenant'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/B2SourceSnapshot'}
      responses:
        '201': {description: Applied atomically (with receipt, audit and pending outbox)}
        '200': {description: Exact duplicate replay, no writes}
        '400': {description: Invalid source schema or incomplete attestation}
        '401': {description: Missing, invalid or expired service identity}
        '403': {description: Unbound source service, revoked person consent, wrong person reference or browser request}
        '409': {description: Conflicting replay, out-of-order source revision or duplicate canonical economic asset}
        '422': {description: Stale source or source authority mismatch}
        '503': {description: Integration issuer or restricted ingestion account unconfigured}

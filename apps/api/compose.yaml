# DEVELOPMENT-ONLY PostgreSQL; creates isolated wealth_app and wealth_ingest roles. Do not deploy this manifest or passwords to production.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_only_postgres_password
      POSTGRES_DB: wealth_os
    ports:
      - "127.0.0.1:5546:5432"
    volumes:
      - wealth_os_pg_local:/var/lib/postgresql/data
      - ./db/bootstrap/00_roles.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wealth_os"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  wealth_os_pg_local:

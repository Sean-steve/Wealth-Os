name: Wealth OS B3 Staging & Source Evidence Certification
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'deploy/staging/**'
      - '.github/workflows/wealth-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-b3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_postgres_only
          POSTGRES_DB: wealth_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wealth_os_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      WEALTH_MIGRATOR_DATABASE_URL: postgresql://postgres:local_ci_postgres_only@127.0.0.1:5432/wealth_os_ci
      WEALTH_APP_DATABASE_URL: postgresql://wealth_app:local_ci_app_only@127.0.0.1:5432/wealth_os_ci
      WEALTH_INGEST_DATABASE_URL: postgresql://wealth_ingest:local_ci_ingest_only@127.0.0.1:5432/wealth_os_ci
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: npm install --prefix apps/api --no-audit --no-fund
      - name: Provision restricted CI database role
        run: npm run db:ci:role --prefix apps/api
      - name: Apply versioned Postgres migrations
        run: npm run db:migrate --prefix apps/api
      - name: Verify migration idempotence
        run: npm run db:migrate --prefix apps/api
      - name: Strict API TypeScript
        run: npm run typecheck --prefix apps/api
      - name: Unit and cross-tenant PostgreSQL contract tests
        run: npm run test:all --prefix apps/api
      - name: L1 existing-PostgreSQL bootstrap safety tests (no Docker DB)
        run: |
          python3 -m unittest discover -s scripts/local -p 'test_*.py' -v
          python3 -m py_compile scripts/local/setup.py scripts/local/provision_identity.py
      - name: L1 identity-only Compose syntax
        run: |
          mkdir -p .local/wealth-os/keycloak
          printf 'KC_BOOTSTRAP_ADMIN_USERNAME=ci\\nKC_BOOTSTRAP_ADMIN_PASSWORD=ci-only-placeholder\\n' > .local/wealth-os/keycloak/admin.env
          printf '{}\\n' > .local/wealth-os/keycloak/realm.json
          WEALTH_LOCAL_OIDC_PORT=8181 docker compose -f deploy/local/identity.compose.yaml config --quiet
      - name: Host script static-syntax checks
        run: |
          bash -n deploy/staging/deploy.sh
          bash -n deploy/staging/provision-host.sh
      - name: Prove activation blocks when external credentials are absent
        run: |
          if npm run staging:activation:prove --prefix apps/api; then
            echo 'ERROR: live activation proof must reject absent real signed credentials'; exit 1
          fi
          echo 'Live activation correctly refuses unconfigured external provider credentials.'
      - name: Compile deployable staging API JavaScript
        run: npm run build --prefix apps/api
      - name: Verify a providerless environment fails closed
        run: |
          if npm run staging:preflight --prefix apps/api; then
            echo 'ERROR: staging preflight must block missing real IdP/source endpoints'; exit 1
          fi
          echo 'No real provider endpoints: correctly BLOCKED.'
      - name: Build non-root staging API container image
        run: docker build --file deploy/staging/Dockerfile --tag wealth-os-api:ci-check .

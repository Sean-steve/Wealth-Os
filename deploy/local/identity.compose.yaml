# L1 LOCAL TEST ONLY. PostgreSQL runs natively on Ubuntu, never in Docker.
# A one-shot isolated container imports the mode-600 test realm into a restricted
# Keycloak-only volume. The normal Keycloak user can then read it without exposing
# the host's secret file to other local Unix users.
services:
  import-test-realm:
    image: busybox:1.36
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      mkdir -p /keycloak-data/import &&
      cp /run/private-realm.json /keycloak-data/import/wealth-os-local.json &&
      chown -R 1000:0 /keycloak-data &&
      chmod 700 /keycloak-data &&
      chmod 600 /keycloak-data/import/wealth-os-local.json
    volumes:
      - ../../.local/wealth-os/keycloak/realm.json:/run/private-realm.json:ro
      - wealth_os_local_keycloak_data:/keycloak-data
  identity:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: wealth-os-local-keycloak
    depends_on:
      import-test-realm:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - ../../.local/wealth-os/keycloak/admin.env
    command:
      - start-dev
      - --import-realm
      - --hostname=http://127.0.0.1:${WEALTH_LOCAL_OIDC_PORT:-8181}
    ports:
      - "127.0.0.1:${WEALTH_LOCAL_OIDC_PORT:-8181}:8080"
    volumes:
      - wealth_os_local_keycloak_data:/opt/keycloak/data
volumes:
  wealth_os_local_keycloak_data:

# B3 STAGING, not production. No default passwords or public PostgreSQL bindings.
services:
  api:
    image: wealth-os-api:${RELEASE_SHA:?A vetted main commit SHA is required}
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    env_file:
      - /etc/wealth-os/staging/api.env
    environment:
      HOST: 0.0.0.0
      PORT: "3009"
      RUNTIME_MODE: staging
    restart: unless-stopped
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 150
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3009/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  migrate:
    profiles: [migration]
    image: wealth-os-api:${RELEASE_SHA:?A vetted main commit SHA is required}
    env_file: [/etc/wealth-os/staging/migrator.env]
    entrypoint: ["node", "dist/scripts/migrate.js"]
    restart: "no"
    networks: [private]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?A real staging DNS name is required}
      STAGING_ACME_EMAIL: ${STAGING_ACME_EMAIL:?ACME email required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
networks:
  private: {driver: bridge}
volumes:
  caddy_data: {}
  caddy_config: {}
